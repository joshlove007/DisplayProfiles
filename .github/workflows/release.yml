name: Release

# Push a tag such as v0.1.0-beta.1 (or run the workflow by hand) to build the app and the Game Bar widget as one MSIX per
# architecture, sign them with Azure Artifact Signing and publish a GitHub release. Tags with a "-" suffix (beta, rc...) are
# marked as pre-releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, for example v0.1.0-beta.1'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  # Re-running the workflow for a tag that already has a release (for example to get a fresh Store bundle) must not try to
  # create the release again, so the release job only runs when there isn't one.
  check:
    runs-on: ubuntu-latest
    outputs:
      release-exists: ${{ steps.release.outputs.exists }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.release-exists != 'true'
    runs-on: windows-latest
    # Matches the Azure federated credential's subject (...:environment:release), which is what lets this job sign in.
    environment: release
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $tag = $env:TAG
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)(-[0-9A-Za-z.-]+)?$') { throw "Tag '$tag' is not like v1.2.3 or v1.2.3-beta.1" }
          "number=$($Matches[1])" >> $env:GITHUB_OUTPUT
          "full=$($Matches[1])$($Matches[2])" >> $env:GITHUB_OUTPUT
          "prerelease=$([bool]$Matches[2])".ToLower() >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test --solution DisplayProfiles.slnx --nologo

      # The Game Bar widget is a UWP app and needs Visual Studio's MSBuild. Its own (self-signed) signature is thrown away:
      # only its files go into the combined package.
      - name: Build the combined MSIX packages
        shell: pwsh
        run: |
          # The package version's last part is the run number so that every build installs over the previous one.
          $version = "${{ steps.version.outputs.number }}.${{ github.run_number }}"
          foreach ($platform in 'x64', 'ARM64') {
            ./tools/Build-Widget.ps1 -Platform $platform
            ./tools/Build-Package.ps1 -Platform $platform -SkipWidgetBuild -NoSign -Version $version `
              -Publisher 'CN=Joshua Lovelace, O=Joshua Lovelace, L=Hendersonville, S=tn, C=US' -PublisherDisplayName 'Joshua Lovelace'
          }

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the packages with Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: JoshLoveSigning
          certificate-profile-name: DisplayProfiles
          files-folder: ${{ github.workspace }}\artifacts\package
          files-folder-filter: msix
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check the signatures and name the files
        shell: pwsh
        run: |
          foreach ($platform in 'x64', 'ARM64') {
            $msix = Get-ChildItem artifacts/package -Filter "*_$platform.msix" | Select-Object -First 1
            if (-not $msix) { throw "No $platform package was built." }
            $signature = Get-AuthenticodeSignature $msix.FullName
            "$platform : $($signature.Status): $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne 'Valid') { throw "The $platform MSIX signature is $($signature.Status): $($signature.StatusMessage)" }
            Copy-Item $msix.FullName "DisplayProfiles-${{ steps.version.outputs.full }}-$($platform.ToLower()).msix"
          }

      # One file for both architectures: the signed packages combined into a bundle, which is signed as well.
      - name: Bundle the signed packages
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory |
            Where-Object { $_.Name -match '^10\.' -and (Test-Path (Join-Path $_.FullName 'x64\makeappx.exe')) } |
            Sort-Object { [version]$_.Name } | Select-Object -Last 1
          $bundleInput = 'artifacts/bundle-input'
          New-Item -ItemType Directory $bundleInput, artifacts/bundle -Force | Out-Null
          foreach ($platform in 'x64', 'ARM64') {
            Copy-Item (Get-ChildItem artifacts/package -Filter "*_$platform.msix").FullName $bundleInput
          }
          & (Join-Path $sdk.FullName 'x64\makeappx.exe') bundle /d $bundleInput /bv "${{ steps.version.outputs.number }}.${{ github.run_number }}" /p artifacts/bundle/DisplayProfiles.msixbundle /o
          if ($LASTEXITCODE -ne 0) { throw 'makeappx bundle failed.' }

      - name: Sign the bundle with Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: JoshLoveSigning
          certificate-profile-name: DisplayProfiles
          files-folder: ${{ github.workspace }}\artifacts\bundle
          files-folder-filter: msixbundle
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check the bundle signature
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature artifacts/bundle/DisplayProfiles.msixbundle
          "bundle : $($signature.Status): $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid') { throw "The bundle signature is $($signature.Status): $($signature.StatusMessage)" }
          Copy-Item artifacts/bundle/DisplayProfiles.msixbundle "DisplayProfiles-${{ steps.version.outputs.full }}.msixbundle"

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $args = @('release', 'create', $env:TAG, '--title', "Display Profiles ${{ steps.version.outputs.full }}", '--generate-notes', '--verify-tag')
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $args += '--prerelease' }
          $args += (Get-ChildItem DisplayProfiles-* -Include *.msix, *.msixbundle | ForEach-Object Name)
          gh @args

  # The Microsoft Store signs packages itself and gives them their own identity, so it gets a separate, unsigned bundle.
  # It is attached to the GitHub release (to upload in Partner Center, not to install) and kept as a run artifact.
  store:
    needs: release
    # Runs after the release job, and also when that job was skipped because the release already exists.
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build the Store bundle (x64 and ARM64)
        id: bundle
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v(\d+)\.(\d+)\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Tag '$env:TAG' is not like v1.2.3 or v1.2.3-beta.1" }
          # The Store reserves the last part of the version (it must be 0) and needs the first three to go up with every
          # submission, so the third part is the run number.
          $version = "$($Matches[1]).$($Matches[2]).${{ github.run_number }}.0"
          ./tools/Build-StorePackage.ps1 -Version $version
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: store-bundle-${{ steps.bundle.outputs.version }}
          path: artifacts/store/*.msixbundle
          if-no-files-found: error
          retention-days: 90

      - name: Attach the bundle to the release
        shell: pwsh
        run: |
          $bundle = Get-ChildItem artifacts/store -Filter *.msixbundle | Select-Object -First 1
          $name = "DisplayProfiles-$($env:TAG.TrimStart('v'))-store-${{ steps.bundle.outputs.version }}.msixbundle"
          Copy-Item $bundle.FullName $name
          # A re-run replaces the earlier bundle instead of adding another one.
          foreach ($old in (gh release view $env:TAG --json assets -q '.assets[].name' | Where-Object { $_ -like '*-store-*.msixbundle' })) {
            gh release delete-asset $env:TAG $old --yes
          }
          gh release upload $env:TAG $name
