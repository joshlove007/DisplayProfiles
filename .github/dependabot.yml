version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      windows-app-sdk:
        patterns: ["Microsoft.WindowsAppSDK*", "Microsoft.Windows.SDK.BuildTools*", "Microsoft.Windows.CsWin32*"]
      test-tools:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk*", "Microsoft.Testing.*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
