name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Display Profiles version
      description: Shown in Settings > About, or the name of the installer you used.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 (build 26100)
    validations:
      required: true
  - type: textarea
    id: displays
    attributes:
      label: Your displays
      description: Which monitors or TVs are involved, and how are they connected (HDMI, DisplayPort, dock)? The output of `DisplayProfiles.exe list` helps.
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      multiple: true
      options:
        - Desktop window
        - Controller mode / Xbox mode
        - Game Bar widget
        - Command line or shortcuts
        - Installer
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, error messages, or what you already tried.
